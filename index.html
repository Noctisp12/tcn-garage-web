<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCN Garage - Official System</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-panel: #141414;
            --bg-input: #1f1f1f;
            --gold-main: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --gold-hover: #F3E5AB;
            --text-light: #f5f5f5;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --danger: #b30000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-light); padding: 30px; display: flex; justify-content: center; }
        .layout-wrapper { display: flex; gap: 30px; max-width: 1300px; width: 100%; align-items: flex-start; }
        .main-content { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        
        /* ปลดล็อคความสูงของ Sidebar ให้ยืดได้ตามสบาย */
        .sidebar { flex: 1; background-color: var(--bg-panel); border: 1px solid var(--gold-main); border-radius: 12px; padding: 25px; box-shadow: 0 0 20px var(--gold-glow); min-width: 330px; display: flex; flex-direction: column; height: fit-content; }
        
        .header-controls { background-color: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; font-size: 14px; }
        .tab-btn.active, .tab-btn:hover { background-color: var(--gold-main); color: #000; border-color: var(--gold-main); box-shadow: 0 0 10px var(--gold-glow); }
        
        .search-box { flex: 1; max-width: 300px; }
        .search-box input { width: 100%; padding: 12px 15px; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold-main); }
        
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding-right: 5px;}
        .item-card { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; animation: fadeIn 0.4s ease-out forwards; }
        .item-card:hover { border-color: var(--gold-main); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5); }
        .item-image { height: 140px; background-color: #000; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px; text-align: center; position: relative; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-info h4 { font-size: 16px; color: var(--text-light); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-stock { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .price { color: var(--gold-main); font-weight: bold; font-size: 15px; }
        .stock { color: var(--text-muted); font-size: 13px; }
        
        .btn-add, .btn-out { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .btn-add { background: linear-gradient(145deg, #2a2a2a, #141414); color: var(--gold-main); border: 1px solid var(--border-color); box-shadow: 3px 3px 6px #050505, -3px -3px 6px #232323;}
        .btn-add:hover { background: var(--gold-main); color: #000; border-color: var(--gold-main); box-shadow: 0 0 10px var(--gold-glow); }
        .btn-add:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5); }
        .btn-out { background-color: var(--danger); color: #fff; opacity: 0.5; cursor: not-allowed; }
        
        .brand { text-align: center; margin-bottom: 25px; flex-shrink: 0; }
        .brand h1 { color: var(--gold-main); font-size: 28px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--gold-glow); }
        .brand p { color: var(--text-muted); font-size: 12px; margin-top: 5px; }
        .sidebar label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-light); flex-shrink: 0; }
        .sidebar select, .sidebar textarea { width: 100%; padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; outline: none; margin-bottom: 15px; transition: 0.3s; flex-shrink: 0; }
        .sidebar select:focus, .sidebar textarea:focus { border-color: var(--gold-main); }
        
        /* 🛒 กล่องตะกร้าที่ยืดได้อิสระ ไม่ต้องเลื่อน */
        .sidebar-cart-list { background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 15px; height: auto; min-height: 80px; transition: 0.3s; }
        
        .sidebar-cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .sidebar-cart-item:last-child { border-bottom: none; }
        .sidebar-cart-item-info h5 { font-size: 13px; margin-bottom: 4px; color: #fff; }
        .sidebar-cart-item-info span { color: var(--gold-main); font-size: 12px; font-weight: bold; }
        
        .sidebar-qty-control { display: flex; align-items: center; gap: 8px; }
        .sidebar-qty-btn { background: #222; border: 1px solid var(--border-color); color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .sidebar-qty-btn:hover { border-color: var(--gold-main); color: var(--gold-main); }
        .qty-num { font-size: 13px; font-weight: bold; width: 18px; text-align: center; }

        .total-box { background-color: #000; padding: 15px; border-radius: 8px; border: 1px dashed var(--gold-main); text-align: center; margin-bottom: 15px; flex-shrink: 0; }
        .total-box span.label { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 5px; }
        .total-box span.amount { color: var(--gold-main); font-size: 24px; font-weight: bold; }
        .btn-submit { background-color: var(--gold-main); color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
        .btn-submit:hover { background-color: var(--gold-hover); box-shadow: 0 0 15px var(--gold-glow); transform: translateY(-2px); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="layout-wrapper">
    <div class="main-content">
        <div class="header-controls">
            <div class="tabs" id="tab-container">
                <button class="tab-btn active" onclick="changeTab('Customs', this)">Customs</button>
                <button class="tab-btn" onclick="changeTab('Core Parts', this)">Core Parts</button>
                <button class="tab-btn" onclick="changeTab('Service', this)">Service</button>
            </div>
            <div class="search-box">
                <input type="text" placeholder="ค้นหาชิ้นส่วน..." onkeyup="searchItems(this.value)">
            </div>
        </div>
        <div class="item-grid" id="item-grid-container"></div>
    </div>

    <div class="sidebar">
        <div class="brand">
            <h1>TCN Garage</h1>
            <p>ระบบเบิกจ่ายอุปกรณ์</p>
        </div>

        <label for="userSelect">เลือกพนักงานผู้เบิก:</label>
        <select id="userSelect">
            <option value="" disabled selected>-- กรุณาเลือก --</option>
            <option value="Enzo_Scarlatti">1. Enzo Scarlatti</option>
            <option value="Lucas_Harper">2. Lucas Harper</option>
        </select>

        <label>รายการที่เลือก:</label>
        <div class="sidebar-cart-list" id="sidebarCartList">
            <div style="text-align:center; color:var(--text-muted); font-size: 13px; padding-top: 20px; padding-bottom: 20px;">
                ยังไม่มีอุปกรณ์ในตะกร้า
            </div>
        </div>

        <label for="noteInput">หมายเหตุ (ถ้ามี):</label>
        <textarea id="noteInput" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>

        <div class="total-box">
            <span class="label">ยอดรวมการเบิก ($)</span>
            <span class="amount">$<span id="totalPrice">0</span></span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">ยืนยันการเบิก</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1mf83e518JvXRqTdzNorppxmH2Sk64hbC168yhN50YAptaNR38t4-lLNChpFj7sep/exec"; 

    let total = 0;
    let currentCategory = 'Customs';
    let currentSearchQuery = '';
    let cart = {}; 
    let itemsData = []; 

    async function fetchStock() {
        Swal.fire({
            title: 'กำลังเชื่อมต่อฐานข้อมูล...',
            text: 'รอโหลดคลังอุปกรณ์สักครู่',
            allowOutsideClick: false,
            background: '#141414',
            color: '#ffffff',
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const result = await response.json();
            
            if (result.status === "success") {
                itemsData = result.data;
                renderItems('Customs');
                Swal.close();
            } else {
                throw new Error();
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว', text: 'ไม่สามารถดึงข้อมูลคลังอุปกรณ์จาก Sheet ได้', background: '#141414', color: '#ffffff' });
        }
    }

    function renderItems(category, searchQuery = '') {
        const container = document.getElementById('item-grid-container');
        container.innerHTML = ''; 
        currentSearchQuery = searchQuery; 

        const filteredItems = itemsData.filter(item => 
            item.category === category && 
            item.name.toLowerCase().includes(searchQuery.toLowerCase())
        );

        filteredItems.forEach(item => {
            let buttonHTML = '';
            if (item.stock > 0) {
                let countInCart = cart[item.name] ? ` (${cart[item.name]})` : '';
                buttonHTML = `<button class="btn-add" onclick="addItem('${item.name}')">+ เพิ่มลงรายการ${countInCart}</button>`;
            } else {
                buttonHTML = `<button class="btn-out">สินค้าหมด</button>`;
            }

            const fallbackText = `<span>NO IMG<br>${item.name.substring(0, 3).toUpperCase()}</span>`;
            const imgHTML = `<img src="images/${item.image}" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${fallbackText}'">`;

            const itemCard = `
                <div class="item-card">
                    <div class="item-image">${imgHTML}</div>
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <div class="price-stock">
                            <span class="price">$${item.price.toLocaleString()}</span>
                            <span class="stock">เหลือ ${item.stock}</span>
                        </div>
                        ${buttonHTML}
                    </div>
                </div>
            `;
            container.innerHTML += itemCard;
        });
    }

    function changeTab(categoryName, element) {
        currentCategory = categoryName;
        let tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => tab.classList.remove('active'));
        element.classList.add('active');
        renderItems(currentCategory, currentSearchQuery);
    }

    function searchItems(value) {
        renderItems(currentCategory, value);
    }

    function addItem(itemName) {
        let item = itemsData.find(i => i.name === itemName);
        if (item && item.stock > 0) {
            item.stock -= 1;
            total += item.price;
            cart[itemName] = (cart[itemName] || 0) + 1;
            
            updateUI();
        }
    }

    function updateCartQty(itemName, change) {
        let item = itemsData.find(i => i.name === itemName);
        if (!item) return;

        if (change > 0) { 
            if (item.stock > 0) {
                item.stock -= 1;
                cart[itemName] += 1;
                total += item.price;
            } else {
                Swal.fire({ icon: 'warning', title: 'สินค้าหมด', text: 'คลังในระบบหมดลงแล้วครับ', background: '#141414', color: '#ffffff' });
            }
        } else if (change < 0) { 
            if (cart[itemName] > 0) {
                item.stock += 1;
                cart[itemName] -= 1;
                total -= item.price;
                
                if (cart[itemName] === 0) {
                    delete cart[itemName];
                }
            }
        }
        updateUI();
    }

    function renderSidebarCart() {
        const listContainer = document.getElementById('sidebarCartList');
        listContainer.innerHTML = '';

        const cartKeys = Object.keys(cart);
        if (cartKeys.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size: 13px; padding-top: 20px; padding-bottom: 20px;">ยังไม่มีอุปกรณ์ในตะกร้า</div>`;
            return;
        }

        cartKeys.forEach(itemName => {
            let item = itemsData.find(i => i.name === itemName);
            let itemTotal = item.price * cart[itemName];
            
            const cartItemHTML = `
                <div class="sidebar-cart-item">
                    <div class="sidebar-cart-item-info">
                        <h5>${itemName}</h5>
                        <span>$${itemTotal.toLocaleString()}</span>
                    </div>
                    <div class="sidebar-qty-control">
                        <button class="sidebar-qty-btn" onclick="updateCartQty('${itemName}', -1)">-</button>
                        <span class="qty-num">${cart[itemName]}</span>
                        <button class="sidebar-qty-btn" onclick="updateCartQty('${itemName}', 1)">+</button>
                    </div>
                </div>
            `;
            listContainer.innerHTML += cartItemHTML;
        });
    }

    function updateUI() {
        document.getElementById('totalPrice').innerText = total.toLocaleString();
        renderItems(currentCategory, currentSearchQuery);
        renderSidebarCart(); 
    }

    async function submitOrder() {
        const userSelect = document.getElementById('userSelect').value;
        const note = document.getElementById('noteInput').value;

        if (userSelect === "") {
            Swal.fire({ icon: 'warning', title: 'ข้อผิดพลาด', html: 'กรุณาเลือก <b>พนักงานผู้เบิก</b>', confirmButtonColor: '#D4AF37', background: '#141414', color: '#ffffff' });
            return;
        }

        if (total === 0) {
            Swal.fire({ icon: 'warning', title: 'ตะกร้าว่างเปล่า', text: 'กรุณาเลือกอุปกรณ์อย่างน้อย 1 ชิ้น', confirmButtonColor: '#D4AF37', background: '#141414', color: '#ffffff' });
            return;
        }

        let orderStringArray = [];
        for (let itemName in cart) {
            orderStringArray.push(`${itemName} x ${cart[itemName]}`);
        }
        
        const payload = {
            name: userSelect,
            order: orderStringArray.join(', '),
            note: note,
            total: total,
            cart: cart 
        };

        Swal.fire({
            title: 'กำลังอัปเดตระบบคลัง...',
            text: 'รอสักครู่ ระบบกำลังบันทึกและตัดสต็อก',
            allowOutsideClick: false,
            background: '#141414',
            color: '#ffffff',
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
                Swal.fire({
                    icon: 'success', title: 'TCN Garage', text: 'บันทึกประวัติและตัดสต็อกสำเร็จ!',
                    confirmButtonText: 'ตกลง', confirmButtonColor: '#D4AF37', background: '#141414', color: '#ffffff'
                }).then((res) => {
                    if (res.isConfirmed) window.location.reload(); 
                });
            } else {
                throw new Error();
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง', confirmButtonColor: '#D4AF37', background: '#141414', color: '#ffffff' });
        }
    }

    window.onload = () => {
        fetchStock();
    };
</script>

</body>
</html>
