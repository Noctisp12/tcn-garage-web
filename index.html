<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCN Garage - Official Tablet</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-body: #080808; 
            --bg-panel: #141414;
            --bg-input: #1f1f1f;
            --gold-main: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --gold-hover: #F3E5AB;
            --text-light: #f5f5f5;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --danger: #b30000;
            --warning: #ff9900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
            background-size: 40px 40px; 
            color: var(--text-light); 
            padding: 40px 20px 20px 20px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%; left: -10%; width: 120%; height: 120%;
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* 💻 BOOT SEQUENCE SCREEN */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            padding: 50px;
            font-family: 'Courier New', Courier, monospace;
            transition: opacity 1s ease-out, visibility 1s;
        }
        #boot-screen.hidden { opacity: 0; visibility: hidden; }
        .boot-line {
            color: var(--gold-main); font-size: 14px; margin-bottom: 8px; opacity: 0;
            text-shadow: 0 0 5px var(--gold-glow);
        }
        .boot-cursor {
            display: inline-block; width: 10px; height: 15px; background-color: var(--gold-main);
            animation: blink 0.8s infinite; margin-left: 5px; vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 📱 Tablet Status Bar */
        .status-bar { position: fixed; top: 0; left: 0; width: 100%; height: 25px; background-color: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; color: #aaa; z-index: 1000; border-bottom: 1px solid #222; user-select: none; }
        .status-bar .left { display: flex; gap: 15px; }
        .status-bar .right { display: flex; gap: 10px; align-items: center; }
        .battery { display: flex; align-items: center; gap: 3px; }
        .battery-icon { width: 20px; height: 10px; border: 1px solid #aaa; border-radius: 2px; padding: 1px; position: relative; }
        .battery-icon::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; background: #aaa; }
        .battery-level { height: 100%; width: 85%; background: var(--text-light); }

        .layout-wrapper { display: flex; gap: 20px; max-width: 1300px; width: 100%; align-items: flex-start; z-index: 1; opacity: 0; transition: opacity 1.5s ease-in; }
        .layout-wrapper.ready { opacity: 1; }

        .main-content { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        
        .sidebar { flex: 1; background-color: var(--bg-panel); border: 1px solid var(--gold-main); border-radius: 12px; padding: 25px; box-shadow: 0 0 20px var(--gold-glow); min-width: 330px; display: flex; flex-direction: column; height: fit-content; backdrop-filter: blur(5px); position: sticky; top: 40px; }
        
        .header-controls { background-color: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 20px; backdrop-filter: blur(5px); }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; font-size: 14px; }
        .tab-btn.active, .tab-btn:hover { background-color: var(--gold-main); color: #000; border-color: var(--gold-main); box-shadow: 0 0 10px var(--gold-glow); }
        
        .search-box { flex: 1; max-width: 300px; }
        .search-box input { width: 100%; padding: 12px 15px; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold-main); }
        
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding-right: 5px;}
        .item-card { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; animation: fadeIn 0.4s ease-out forwards; backdrop-filter: blur(5px); }
        .item-card:hover { border-color: var(--gold-main); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5); }
        .item-image { height: 140px; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px; text-align: center; position: relative; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-info h4 { font-size: 16px; color: var(--text-light); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-stock { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .price { color: var(--gold-main); font-weight: bold; font-size: 15px; }
        .stock { color: var(--text-muted); font-size: 13px; font-weight: 600; }
        
        .stock-low { color: var(--warning); animation: pulseAlert 1.5s infinite; }
        @keyframes pulseAlert { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .btn-add, .btn-out { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .btn-add { background: linear-gradient(145deg, #2a2a2a, #141414); color: var(--gold-main); border: 1px solid var(--border-color); box-shadow: 3px 3px 6px rgba(0,0,0,0.8), -3px -3px 6px rgba(40,40,40,0.2);}
        .btn-add:hover { background: var(--gold-main); color: #000; border-color: var(--gold-main); box-shadow: 0 0 10px var(--gold-glow); }
        .btn-add:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5); }
        .btn-out { background-color: var(--danger); color: #fff; opacity: 0.5; cursor: not-allowed; }
        
        .brand { text-align: center; margin-bottom: 20px; flex-shrink: 0; cursor: pointer; }
        .brand h1 { color: var(--gold-main); font-size: 28px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--gold-glow); transition: 0.3s;}
        .brand h1:hover { color: #fff; }
        .brand p { color: var(--text-muted); font-size: 12px; margin-top: 5px; }

        .sidebar label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-light); flex-shrink: 0; }
        .sidebar select, .sidebar textarea { width: 100%; padding: 10px; background-color: rgba(31, 31, 31, 0.8); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; outline: none; margin-bottom: 15px; transition: 0.3s; flex-shrink: 0; font-size: 14px; }
        
        .sidebar-cart-list { background-color: rgba(31, 31, 31, 0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 15px; height: auto; min-height: 80px; transition: 0.3s; }
        .sidebar-cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid #2a2a2a; }
        .sidebar-cart-item:last-child { border-bottom: none; }
        .sidebar-cart-item-info h5 { font-size: 13px; margin-bottom: 2px; color: #fff; }
        .sidebar-cart-item-info span { color: var(--gold-main); font-size: 12px; font-weight: bold; }
        
        .sidebar-qty-control { display: flex; align-items: center; gap: 8px; }
        .sidebar-qty-btn { background: #222; border: 1px solid var(--border-color); color: #fff; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        
        .total-box { background-color: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; border: 1px dashed var(--gold-main); text-align: center; margin-bottom: 15px; flex-shrink: 0; }
        .total-box span.label { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 5px; }
        .total-box span.amount { color: var(--gold-main); font-size: 24px; font-weight: bold; }
        .btn-submit { background-color: var(--gold-main); color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
        .btn-submit:hover { background-color: var(--gold-hover); box-shadow: 0 0 15px var(--gold-glow); transform: translateY(-2px); }

        /* 📜 History Table */
        .history-container { display: none; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; animation: fadeIn 0.4s ease-out; backdrop-filter: blur(5px); }
        .history-container h2 { color: var(--gold-main); margin-bottom: 20px; font-size: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .history-table th, .history-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; }
        .history-table th { color: var(--gold-main); background: rgba(0,0,0,0.5); font-weight: bold; }
        .history-table tr:hover { background: rgba(212, 175, 55, 0.05); }
        .history-table td.total-col { color: var(--gold-main); font-weight: bold; }

        /* 📊 Dashboard Modal */
        .app-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: 0.3s; }
        .app-modal.active { visibility: visible; opacity: 1; }
        .modal-content { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; width: 800px; max-width: 90%; position: relative; box-shadow: 0 0 40px #000; animation: scaleUp 0.3s ease-out; }
        .close-app { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #fff; cursor: pointer; background: none; border: none; transition: 0.2s; }
        .close-app:hover { color: var(--danger); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleUp { from { transform: scale(0.95); } to { transform: scale(1); } }
    </style>
</head>
<body>

<!-- 💻 BOOT SEQUENCE SCREEN -->
<div id="boot-screen">
    <div id="boot-text-container"></div>
    <div class="boot-cursor"></div>
</div>

<div class="status-bar">
    <div class="left">
        <span id="sb-date">--/--/----</span>
        <span>TCN OS v2.6</span>
    </div>
    <div class="right">
        <span id="sb-time">--:--</span>
        <div class="battery">
            <div class="battery-icon"><div class="battery-level"></div></div>
            <span>85%</span>
        </div>
    </div>
</div>

<div class="layout-wrapper" id="main-layout">
    <div class="main-content">
        <div class="header-controls">
            <div class="tabs" id="tab-container">
                <button class="tab-btn active" onclick="changeTab('Customs', this)">Customs</button>
                <button class="tab-btn" onclick="changeTab('Core Parts', this)">Core Parts</button>
                <button class="tab-btn" onclick="changeTab('Service', this)">Service</button>
                <button class="tab-btn" onclick="changeTab('History', this)" style="border-color: #555; color: #ccc;">📜 ประวัติ (Log)</button>
            </div>
            <div class="search-box" id="searchBox">
                <input type="text" placeholder="ค้นหาชิ้นส่วน..." onkeyup="searchItems(this.value)">
            </div>
        </div>
        
        <div class="item-grid" id="item-grid-container"></div>

        <div class="history-container" id="history-container">
            <h2>📜 ประวัติการเบิกอุปกรณ์ (30 รายการล่าสุด)</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>เวลาทำรายการ</th>
                        <th>พนักงาน</th>
                        <th>รายการ</th>
                        <th>หมายเหตุ</th>
                        <th>ยอดรวม ($)</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand" onclick="toggleApp('dashboardModal')">
            <h1>TCN Garage</h1>
            <p>ระบบเบิกจ่ายอุปกรณ์ 📊</p>
        </div>

        <label for="userSelect">เลือกพนักงานผู้เบิก:</label>
        <select id="userSelect">
            <option value="" disabled selected>-- กรุณาเลือก --</option>
            <option value="Enzo_Scarlatti">1. Enzo Scarlatti</option>
            <option value="Lucas_Harper">2. Lucas Harper</option>
        </select>

        <label>รายการที่เลือก:</label>
        <div class="sidebar-cart-list" id="sidebarCartList">
            <div style="text-align:center; color:var(--text-muted); font-size: 13px; padding: 20px 0;">ยังไม่มีอุปกรณ์ในตะกร้า</div>
        </div>

        <label for="noteInput">หมายเหตุ (ถ้ามี):</label>
        <textarea id="noteInput" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>

        <div class="total-box">
            <span class="label">ยอดรวมการเบิก ($)</span>
            <span class="amount">$<span id="totalPrice">0</span></span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">ยืนยันการเบิก</button>
    </div>
</div>

<div class="app-modal" id="dashboardModal">
    <div class="modal-content">
        <button class="close-app" onclick="toggleApp('dashboardModal')">✕</button>
        <h2 style="color: var(--gold-main); margin-bottom: 20px;">📊 สรุปมูลค่าคลังสินค้า TCN</h2>
        <canvas id="stockChart" height="100"></canvas>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1mf83e518JvXRqTdzNorppxmH2Sk64hbC168yhN50YAptaNR38t4-lLNChpFj7sep/exec"; 
    let total = 0, currentCategory = 'Customs', currentSearchQuery = '', cart = {}, itemsData = [], logsData = []; 
    let chartInstance = null;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // 🚀 BOOT SEQUENCE LOGIC
    const bootLines = [
        "TCN_OS_v2.6 BOOT SEQUENCE INITIATED...",
        "CONNECTING TO LOS SANTOS DATABASES... [OK]",
        "MOUNTING SECURE DRIVES... [OK]",
        "LOADING SCARLATTI PERFORMANCE PROTOCOLS... [OK]",
        "VERIFYING MECHANIC CREDENTIALS... [AUTHORIZED]",
        "SYNCING LIVE INVENTORY DATA...",
        "SYSTEM READY."
    ];

    function runBootSequence() {
        const container = document.getElementById('boot-text-container');
        const bootScreen = document.getElementById('boot-screen');
        const mainLayout = document.getElementById('main-layout');
        let delay = 0;

        // เพื่อไม่ให้รำคาญเวลา Refresh จะเช็ค Session Storage ไว้ว่าโหลดแล้วหรือยัง
        // ถ้าอยากให้โหลดทุกครั้งที่เข้าเว็บ ให้ลบ 2 บรรทัดด้านล่างนี้ออกครับ
        if (sessionStorage.getItem('tcn_booted')) {
            bootScreen.style.display = 'none';
            mainLayout.classList.add('ready');
            fetchStock();
            return;
        }

        bootLines.forEach((line, index) => {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'boot-line';
                p.innerText = line;
                container.appendChild(p);
                // ทำให้ค่อยๆ ชัดขึ้น
                setTimeout(() => p.style.opacity = 1, 50);
                
                // เล่นเสียง Tick เบาๆ ตอนโหลดตัวหนังสือ
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(800 + (Math.random()*200), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);

            }, delay);
            delay += 400; // ห่างกันบรรทัดละ 0.4 วินาที
        });

        setTimeout(() => {
            bootScreen.classList.add('hidden');
            setTimeout(() => {
                bootScreen.style.display = 'none';
                mainLayout.classList.add('ready');
                sessionStorage.setItem('tcn_booted', 'true');
                fetchStock(); // โหลดข้อมูลจาก Sheet หลังจาก Boot เสร็จ
            }, 1000);
        }, delay + 600);
    }


    function playTabSound() { if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.03, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); }
    function playAddSound() { if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    function playRemoveSound() { if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    function playErrorSound() { if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
    function playSuccessSound() { if(audioCtx.state === 'suspended') audioCtx.resume(); const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc1.type = 'triangle'; osc2.type = 'sine'; osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4); osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination); osc1.start(); osc1.stop(audioCtx.currentTime + 0.15); osc2.start(audioCtx.currentTime + 0.15); osc2.stop(audioCtx.currentTime + 0.4); }

    setInterval(() => {
        const now = new Date();
        document.getElementById('sb-time').innerText = now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
        document.getElementById('sb-date').innerText = now.toLocaleDateString('th-TH', {day:'2-digit', month:'short', year:'numeric'});
    }, 1000);

    async function fetchStock() {
        Swal.fire({ title: 'TCN OS', text: 'กำลังซิงค์ข้อมูลกับคลังหลัก...', allowOutsideClick: false, background: '#141414', color: '#fff', didOpen: () => Swal.showLoading() });
        try { 
            const response = await fetch(GOOGLE_SCRIPT_URL); 
            const result = await response.json(); 
            if (result.status === "success") { 
                itemsData = result.data; 
                logsData = result.logs || []; 
                renderItems('Customs'); 
                Swal.close(); 
            } else throw new Error(); 
        } 
        catch (error) { Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว', background: '#141414', color: '#fff' }); }
    }

    function renderItems(category, searchQuery = '') {
        const container = document.getElementById('item-grid-container');
        container.innerHTML = ''; currentSearchQuery = searchQuery; 
        const filteredItems = itemsData.filter(item => item.category === category && item.name.toLowerCase().includes(searchQuery.toLowerCase()));

        filteredItems.forEach(item => {
            let stockLabelHTML = item.stock > 5 ? `<span class="stock">เหลือ ${item.stock}</span>` : item.stock > 0 ? `<span class="stock stock-low">⚠️ ใกล้หมด (${item.stock})</span>` : `<span class="stock" style="color: var(--danger);">หมด!</span>`;
            let btnHTML = item.stock > 0 ? `<button class="btn-add" onclick="addItem('${item.name}')">+ เพิ่มลงรายการ${cart[item.name] ? ` (${cart[item.name]})`:''}</button>` : `<button class="btn-out" onclick="playErrorSound()">สินค้าหมด</button>`;
            const fallback = `<span>NO IMG<br>${item.name.substring(0, 3).toUpperCase()}</span>`;
            const imgHTML = `<img src="images/${item.image}" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='${fallback}'">`;
            container.innerHTML += `<div class="item-card"><div class="item-image">${imgHTML}</div><div class="item-info"><h4>${item.name}</h4><div class="price-stock"><span class="price">$${item.price.toLocaleString()}</span>${stockLabelHTML}</div>${btnHTML}</div></div>`;
        });
    }

    function renderHistory() {
        const tbody = document.getElementById('history-table-body');
        tbody.innerHTML = '';
        if (logsData.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #888;">ไม่มีประวัติการทำรายการ</td></tr>`; return; }
        
        logsData.forEach(log => {
            const dateObj = new Date(log.time);
            const dateStr = isNaN(dateObj) ? log.time : dateObj.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
            const mechName = (log.mechanic || '').replace('_', ' ');
            tbody.innerHTML += `<tr><td>${dateStr}</td><td>${mechName}</td><td style="font-size: 12px; color: #ccc;">${log.order}</td><td style="font-size: 12px; color: #ccc;">${log.note || '-'}</td><td class="total-col">$${Number(log.total).toLocaleString()}</td></tr>`;
        });
    }

    function changeTab(cat, el) { 
        currentCategory = cat; 
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active')); 
        el.classList.add('active'); 
        playTabSound(); 

        if (cat === 'History') {
            document.getElementById('item-grid-container').style.display = 'none';
            document.getElementById('searchBox').style.visibility = 'hidden';
            document.getElementById('history-container').style.display = 'block';
            renderHistory();
        } else {
            document.getElementById('item-grid-container').style.display = 'grid';
            document.getElementById('searchBox').style.visibility = 'visible';
            document.getElementById('history-container').style.display = 'none';
            renderItems(currentCategory, currentSearchQuery); 
        }
    }
    
    function searchItems(val) { renderItems(currentCategory, val); }

    function addItem(name) { let item = itemsData.find(i => i.name === name); if (item && item.stock > 0) { item.stock -= 1; total += item.price; cart[name] = (cart[name] || 0) + 1; playAddSound(); updateUI(); } else playErrorSound(); }
    
    function updateCartQty(name, change) {
        let item = itemsData.find(i => i.name === name); if (!item) return;
        if (change > 0 && item.stock > 0) { item.stock -= 1; cart[name]++; total += item.price; playAddSound(); }
        else if (change > 0 && item.stock === 0) { playErrorSound(); Swal.fire({ icon: 'warning', title: 'สินค้าหมด', text: 'คลังในระบบหมดลงแล้วครับ', background: '#141414', color: '#ffffff' }); }
        else if (change < 0 && cart[name] > 0) { item.stock += 1; cart[name]--; total -= item.price; if(cart[name]===0) delete cart[name]; playRemoveSound(); }
        updateUI();
    }

    function renderSidebarCart() {
        const list = document.getElementById('sidebarCartList'); list.innerHTML = ''; const keys = Object.keys(cart);
        if (keys.length === 0) { list.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size: 13px; padding: 20px 0;">ยังไม่มีอุปกรณ์ในตะกร้า</div>`; return; }
        keys.forEach(name => { let item = itemsData.find(i => i.name === name); list.innerHTML += `<div class="sidebar-cart-item"><div class="sidebar-cart-item-info"><h5>${name}</h5><span>$${(item.price * cart[name]).toLocaleString()}</span></div><div class="sidebar-qty-control"><button class="sidebar-qty-btn" onclick="updateCartQty('${name}', -1)">-</button><span class="qty-num">${cart[name]}</span><button class="sidebar-qty-btn" onclick="updateCartQty('${name}', 1)">+</button></div></div>`; });
    }

    function updateUI() { 
        document.getElementById('totalPrice').innerText = total.toLocaleString(); 
        if (currentCategory !== 'History') { renderItems(currentCategory, currentSearchQuery); }
        renderSidebarCart(); 
    }

    function generateInvoiceHTML(user, note) {
        let html = `<div style="font-family: 'Courier New', monospace; text-align: left; background: #fff; color: #000; padding: 25px; border-radius: 4px; border: 1px solid #ccc; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);"><div style="text-align: center; border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 15px;"><h2 style="margin: 0; font-size: 24px; font-weight: 900;">TCN GARAGE</h2><p style="margin: 5px 0 0 0; font-size: 14px;">LOS SANTOS, SAN ANDREAS</p></div><p style="margin: 5px 0; font-size: 14px;"><strong>ช่างผู้ทำรายการ:</strong> ${user.replace('_', ' ')}</p><p style="margin: 5px 0 15px 0; font-size: 14px;"><strong>วันที่:</strong> ${new Date().toLocaleString('th-TH')}</p><table style="width: 100%; font-size: 14px; border-collapse: collapse; margin-bottom: 15px;"><tr style="border-bottom: 1px solid #000;"><th style="text-align:left; padding-bottom:5px;">รายการ</th><th style="text-align:center;">จำนวน</th><th style="text-align:right;">ราคา</th></tr>`;
        for (let name in cart) { let item = itemsData.find(i => i.name === name); html += `<tr><td style="padding: 5px 0;">${name}</td><td style="text-align:center;">${cart[name]}</td><td style="text-align:right;">$${(item.price * cart[name]).toLocaleString()}</td></tr>`; }
        html += `</table><div style="border-top: 2px dashed #000; padding-top: 10px; text-align: right; font-size: 18px;"><strong>ยอดรวมสุทธิ: <span style="font-size: 24px;">$${total.toLocaleString()}</span></strong></div>${note ? `<p style="margin-top:15px; font-size:12px; color:#555;">หมายเหตุ: ${note}</p>` : ''}<div style="text-align: center; margin-top: 20px; font-size: 12px; color: #666;">*** แคปรูปบิลนี้เพื่อใช้เรียกเก็บเงินลูกค้า ***</div></div>`; return html;
    }

    async function submitOrder() {
        const user = document.getElementById('userSelect').value; const note = document.getElementById('noteInput').value;
        if (user === "") { playErrorSound(); return Swal.fire({ icon: 'warning', title: 'ข้อผิดพลาด', text: 'กรุณาเลือกพนักงาน', background: '#141414', color: '#fff' }); }
        if (total === 0) { playErrorSound(); return Swal.fire({ icon: 'warning', title: 'ตะกร้าว่างเปล่า', text: 'กรุณาเลือกอุปกรณ์', background: '#141414', color: '#fff' }); }
        let orderArr = []; for (let n in cart) orderArr.push(`${n} x ${cart[n]}`);
        const payload = { name: user, order: orderArr.join(', '), note: note, total: total, cart: cart };
        
        Swal.fire({ title: 'กำลังพิมพ์บิล...', allowOutsideClick: false, background: '#141414', color: '#fff', didOpen: () => Swal.showLoading() });
        try { 
            const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); 
            const result = await res.json();
            if (result.status === "success") { 
                playSuccessSound(); 
                // เคลียร์ Session ให้เปิดมาดูแอนิเมชันใหม่ได้หลังจากกดยืนยันเสร็จ (ถ้าไม่ชอบลบ 1 บรรทัดล่างนี้ทิ้งได้ครับ)
                sessionStorage.removeItem('tcn_booted'); 
                Swal.fire({ html: generateInvoiceHTML(user, note), width: 500, background: '#e6e6e6', confirmButtonText: 'ปิดและเริ่มใหม่', confirmButtonColor: '#000', allowOutsideClick: false }).then(() => window.location.reload()); 
            } else throw new Error();
        } catch (e) { playErrorSound(); Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', background: '#141414', color: '#fff' }); }
    }

    function toggleApp(appId) { const modal = document.getElementById(appId); if (!modal.classList.contains('active')) { playTabSound(); modal.classList.add('active'); if (appId === 'dashboardModal') renderChart(); } else { playTabSound(); modal.classList.remove('active'); } }

    function renderChart() {
        if (!itemsData.length) return; const ctx = document.getElementById('stockChart').getContext('2d'); if (chartInstance) chartInstance.destroy(); 
        const catData = { 'Customs': 0, 'Core Parts': 0, 'Service': 0 }; itemsData.forEach(i => { if(catData[i.category] !== undefined) catData[i.category] += (i.price * i.stock); });
        chartInstance = new Chart(ctx, { type: 'bar', data: { labels: Object.keys(catData), datasets: [{ label: 'มูลค่าคลังสินค้า (USD)', data: Object.values(catData), backgroundColor: ['rgba(212, 175, 55, 0.7)', 'rgba(54, 162, 235, 0.7)', 'rgba(255, 99, 132, 0.7)'], borderColor: ['#D4AF37', '#36A2EB', '#FF6384'], borderWidth: 1 }] }, options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } }, plugins: { legend: { labels: { color: '#fff' } } } } });
    }

    // เรียกใช้ฟังก์ชัน Boot เมื่อโหลดหน้าเว็บเสร็จ
    window.onload = runBootSequence;
</script>
</body>
</html>
